name: Spike — measure minimal TeX + Lilypond size

# Throwaway measurement job for the "bundle vs require system TeX" decision
# (see TODO.md Phase 0). Not part of the release pipeline — safe to delete
# once the bundling decision is made.
#
# Installs a minimal custom TeX Live scheme (via tlmgr, not the OS package
# manager, since that's what an actual bundle would use) plus Lilypond (via
# the official relocatable archives), and reports the disk-usage delta
# before/after on each of the three target platforms.
#
# Lessons from the first run, now baked in:
# - Pin one known-good CTAN repo (tlnet.yihui.org, TinyTeX's dedicated
#   mirror) instead of mirror.ctan.org — the round-robin can hand out a
#   dead/glacial mirror.
# - A real gregorio+lualatex compile needs more than the obvious packages;
#   the current TL_PACKAGES list is verified by the smoke test below.
# - timeout-minutes so a hang fails in 1h, not GitHub's 6h default.
#
# Lessons from the second run, now baked in:
# - "pifont" is not a TeX Live package name (pifont.sty ships inside psnfss,
#   which scheme-basic already installs) — tlmgr exits 1 on the unknown name,
#   which is what killed the Linux and macOS legs.
# - TLBIN/LPBIN must be on PATH for the compile: lyluatex's EPS output is
#   converted by epstopdf-base shell-escaping `repstopdf`, and gregoriotex
#   shell-escapes `gregorio` for inline snippets. Absolute paths to lualatex
#   alone are not enough.
# - install-tl-windows.exe is a GUI self-extractor; on a headless runner any
#   prompt or error dialog blocks forever (both runs hung there). Use
#   install-tl.zip + install-tl-windows.bat -no-gui instead (console-only,
#   same path TinyTeX uses), and give downloads/steps explicit timeouts.
# - pwsh does NOT stop on non-zero native exit codes — every native call
#   needs an explicit $LASTEXITCODE check or failures pass silently.
# - Windows TeX Live needs tlgs.windows (bundled ghostscript) for the
#   EPS→PDF conversion; nothing pulls it in as a dependency.
#
# Lessons from the third run (Windows green, Linux/macOS failed in the
# compile), now baked in:
# - GH's ubuntu/macos runners do NOT have ghostscript on PATH, and neither
#   TeX Live scheme-basic nor $LPBIN provide one — epstopdf fails with
#   "Required program gs not found". Fix costs nothing: the official
#   Lilypond archive bundles gs 10.06 at libexec/gs, so put
#   $LPBIN/../libexec on PATH. A shipped app bundle can do exactly the
#   same (no separate ghostscript to ship on any platform: reuse
#   lilypond's on mac/linux, tlgs.windows on windows).

env:
  CTAN_REPO: https://tlnet.yihui.org
  # The lyluatex group (lyluatex … metalogo) is for lilypond embedding —
  # tlmgr does not pull these in as dependencies of lyluatex, each one
  # surfaced as a missing-file error in a real compile. luacode is for
  # embedding frpunct.lua verbatim in a single-file export (luacode*
  # preserves newlines, which \directlua does not — the lua `--` comments
  # would swallow the rest of the chunk).
  TL_PACKAGES: luatex latex-bin latex graphics gregoriotex fontspec xcolor kvoptions luacolor luatexbase luamplib xstring luacode lyluatex minibox environ currfile filehook pdfpages luaoptions xkeyval metalogo
  LILYPOND_VERSION: 2.26.0

on:
  workflow_dispatch:

jobs:
  measure:
    name: Measure (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # lilypond_arch matches the official relocatable archives on
          # GitLab releases — that's what an actual bundle would ship,
          # unlike brew/choco/apt installs (darwin-x86_64 on the Intel
          # runner, same as the app's own Intel-only mac build).
          - os: macos-15-intel
            platform: macos
            lilypond_arch: darwin-x86_64
          - os: windows-latest
            platform: windows
            lilypond_arch: mingw-x86_64
          - os: ubuntu-latest
            platform: linux
            lilypond_arch: linux-x86_64

    steps:
      - uses: actions/checkout@v6   # for app/defaults/frpunct.lua

      - name: Disk usage before (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          df -k / | tail -1 | awk '{print $3}' > before.txt
          cat before.txt

      - name: Disk usage before (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          (Get-PSDrive C).Used | Out-File -FilePath before.txt
          Get-Content before.txt

      # ── Minimal TeX Live scheme via tlmgr (same method on all 3 OSes) ──

      - name: Install minimal TeX Live scheme (macOS/Linux)
        if: runner.os != 'Windows'
        timeout-minutes: 30
        shell: bash
        run: |
          set -e
          curl -sL --retry 10 --retry-delay 30 "$CTAN_REPO/install-tl-unx.tar.gz" -o install-tl.tar.gz
          mkdir install-tl && tar -xzf install-tl.tar.gz -C install-tl --strip-components=1
          cat > profile.txt <<'EOF'
          selected_scheme scheme-basic
          TEXDIR ./texlive-min
          TEXMFLOCAL ./texlive-min/texmf-local
          TEXMFSYSVAR ./texlive-min/texmf-var
          TEXMFSYSCONFIG ./texlive-min/texmf-config
          TEXMFVAR ./texlive-min/texmf-var-user
          TEXMFCONFIG ./texlive-min/texmf-config-user
          TEXMFHOME ./texlive-min/texmf-home
          instopt_adjustpath 0
          instopt_adjustrepo 0
          tlpdbopt_autobackup 0
          tlpdbopt_install_docfiles 0
          tlpdbopt_install_srcfiles 0
          EOF
          ./install-tl/install-tl -profile profile.txt -repository "$CTAN_REPO"
          TLBIN=$(find "$PWD/texlive-min/bin" -maxdepth 1 -mindepth 1 -type d | head -1)
          echo "TLBIN=$TLBIN" >> "$GITHUB_ENV"
          "$TLBIN/tlmgr" --repository "$CTAN_REPO" install $TL_PACKAGES
          du -sh ./texlive-min

      - name: Install minimal TeX Live scheme (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 30
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # install-tl.zip + install-tl-windows.bat, NOT install-tl-windows.exe:
          # the .exe is a GUI self-extractor that blocks forever on a headless
          # runner if anything prompts.
          Invoke-WebRequest -Uri "$env:CTAN_REPO/install-tl.zip" -OutFile install-tl.zip -TimeoutSec 600
          Expand-Archive install-tl.zip -DestinationPath .
          $tlroot = Get-ChildItem -Directory -Filter 'install-tl-*' | Select-Object -First 1
          $tlprofile = @"
          selected_scheme scheme-basic
          TEXDIR ./texlive-min
          TEXMFLOCAL ./texlive-min/texmf-local
          TEXMFSYSVAR ./texlive-min/texmf-var
          TEXMFSYSCONFIG ./texlive-min/texmf-config
          TEXMFVAR ./texlive-min/texmf-var-user
          TEXMFCONFIG ./texlive-min/texmf-config-user
          TEXMFHOME ./texlive-min/texmf-home
          instopt_adjustpath 0
          instopt_adjustrepo 0
          tlpdbopt_autobackup 0
          tlpdbopt_install_docfiles 0
          tlpdbopt_install_srcfiles 0
          "@
          Set-Content -Path profile.txt -Value $tlprofile
          & "$($tlroot.FullName)\install-tl-windows.bat" -no-gui -profile profile.txt -repository $env:CTAN_REPO
          if ($LASTEXITCODE -ne 0) { throw "install-tl failed ($LASTEXITCODE)" }
          $tlbin = Get-ChildItem -Path ".\texlive-min\bin" -Directory | Select-Object -First 1
          # tlgs.windows: TL's bundled ghostscript, needed by repstopdf
          & "$($tlbin.FullName)\tlmgr.bat" --repository $env:CTAN_REPO install ($env:TL_PACKAGES.Split(' ') + 'tlgs.windows')
          if ($LASTEXITCODE -ne 0) { throw "tlmgr install failed ($LASTEXITCODE)" }
          "TLBIN=$($tlbin.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ── Lilypond: official relocatable archive (what a bundle would ship) ──

      - name: Install Lilypond (macOS/Linux)
        if: runner.os != 'Windows'
        timeout-minutes: 15
        shell: bash
        run: |
          set -e
          curl -sL --retry 10 --retry-delay 30 -o lilypond.tar.gz \
            "https://gitlab.com/lilypond/lilypond/-/releases/v${LILYPOND_VERSION}/downloads/lilypond-${LILYPOND_VERSION}-${{ matrix.lilypond_arch }}.tar.gz"
          tar -xzf lilypond.tar.gz
          echo "LPBIN=$PWD/lilypond-${LILYPOND_VERSION}/bin" >> "$GITHUB_ENV"
          du -sh "lilypond-${LILYPOND_VERSION}"

      - name: Install Lilypond (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -TimeoutSec 600 -OutFile lilypond.zip -Uri `
            "https://gitlab.com/lilypond/lilypond/-/releases/v$env:LILYPOND_VERSION/downloads/lilypond-$env:LILYPOND_VERSION-${{ matrix.lilypond_arch }}.zip"
          Expand-Archive lilypond.zip -DestinationPath .
          "LPBIN=$PWD\lilypond-$env:LILYPOND_VERSION\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ── Compile smoke test: the size number is worthless if the bundle  ──
      # ── can't compile the app's real workload. Two paths:               ──
      # ──  1. preview path — an external .ly (as linked in a project      ──
      # ──     file) cropped to PDF with lilypond -dcrop, and              ──
      # ──  2. export path — ONE self-contained .tex, mirroring the        ──
      # ──     app's single-file export: defs first (frpunct.lua embedded  ──
      # ──     verbatim via luacode*), then the body with the gabc and     ──
      # ──     lilypond sources inline (\gabcsnippet + lyluatex's ly env,  ──
      # ──     both compiled mid-run via shell escape). No external        ──
      # ──     \input/\includegraphics/\gregorioscore/\lilypondfile refs.  ──

      - name: Prepare smoke test files
        shell: bash
        run: |
          set -e
          mkdir -p smoke
          # preview-path input: external .ly like the ones users link
          cat > smoke/piece.ly <<'EOF'
          \version "2.26.0"
          #(set-global-staff-size 16)
          \paper { indent = 0 }
          \score {
            \new Staff \relative c' {
              \key f \major
              c4 d e f | g2 a | f1 \bar "|."
            }
            \addlyrics { Le temps des ce -- ri -- ses }
          }
          EOF
          # single-file export: the app's exporter will embed frpunct.lua as a
          # luacode* chunk, registering the callback instead of returning it
          sed 's/^return french_punctuation$/luatexbase.add_to_callback("kerning", french_punctuation, "frpunct.french_punctuation")/' \
            app/defaults/frpunct.lua > frpunct-embedded.lua
          cat > head.tex <<'EOF'
          % Same package surface as app/defaults/configuration.tex, with the
          % proprietary fonts swapped for the bundle's Latin Modern (real
          % fonts are OS-installed via fontspec, not part of the TeX bundle).
          \documentclass{article}
          \usepackage{fontspec}
          % debug=snippet keeps test.gsnippet/test.gsniplog for the failure
          % dump (macOS chase) — drop the option once that's resolved
          \usepackage[debug=snippet]{gregoriotex}
          \usepackage{graphicx}
          \usepackage{pifont}
          \usepackage{luacode}
          \begin{luacode*}
          EOF
          cat > tail.tex <<'EOF'
          \end{luacode*}
          \definecolor{rougeliturgique}{cmyk}{0,1,0,0}
          \grechangestaffsize{16}
          \gresetlastline{ragged}
          % staffsize option = the one-file stand-in for shared defs.ily
          \usepackage[program={@LILYPOND@},staffsize=16]{lyluatex}
          \begin{document}
          Texte d'essai — ponctuation française : « guillemets » ; point-virgule !
          {\color{rougeliturgique}\ding{72}} rubrique en rouge.

          \gabcsnippet{(c4) KY(g)ri(h)e(hg) *() e(hih)lé(g)i(f)son.(g) (::)
          Chri(g)ste(hg) e(hih)lé(g)i(f)son.(g) (::)}

          \begin{ly}
          \score {
            \new Staff \relative c' {
              \key f \major
              c4 d e f | g2 a | f1 \bar "|."
            }
            \addlyrics { Le temps des ce -- ri -- ses }
          }
          \end{ly}
          \end{document}
          EOF
          cat head.tex frpunct-embedded.lua tail.tex > smoke/test.tex
          # exactly what gregoriotex's direct_gabc feeds gregorio for the
          # \gabcsnippet above (argument newline collapses to a space) —
          # lets the compile step probe gregorio directly, since macOS
          # produces a gtex that differs from Linux's (120 lines here)
          printf 'name:direct-gabc;\n\n%%%%\n(c4) KY(g)ri(h)e(hg) *() e(hih)lé(g)i(f)son.(g) (::) Chri(g)ste(hg) e(hih)lé(g)i(f)son.(g) (::)' > smoke/probe.gabc
          # macOS produced a test.tex with a different line count than
          # Linux (same script!) — record the assembly arithmetic so a
          # failure annotation shows where any extra lines come from
          wc -l head.tex frpunct-embedded.lua tail.tex smoke/test.tex app/defaults/frpunct.lua | tee smoke/prepare.log
          rm -f head.tex tail.tex frpunct-embedded.lua

      - name: Compile smoke test (macOS/Linux)
        if: runner.os != 'Windows'
        timeout-minutes: 15
        shell: bash
        run: |
          set -eo pipefail
          cd smoke
          # PATH, not absolute paths: shell escapes inside the compile call
          # gregorio (gabcsnippet) and repstopdf (lyluatex EPS→PDF), and
          # repstopdf needs a gs — lilypond's bundled one, in libexec
          export PATH="$TLBIN:$LPBIN:$LPBIN/../libexec:$PATH"
          # tee into logs the failure-diagnostics step can dump as public
          # annotations (step logs and summaries need a login to read)
          { echo "PATH=$PATH"; which lilypond lualatex gregorio repstopdf gs || true; } | tee env.log
          # gregorio probe: same input direct_gabc writes; compare the
          # resulting gtex across platforms (linux reference: 120 lines)
          { gregorio --version | head -2; gregorio -W -o probe.gtex -l probe.gsniplog probe.gabc; echo "probe exit=$?"; wc -l probe.gtex; } > probe.info 2>&1 || true
          cat probe.info
          # 1. preview path
          lilypond -dcrop --pdf piece.ly 2>&1 | tee preview.log
          test -s piece.cropped.pdf && echo "preview path OK: piece.cropped.pdf"
          # 2. single-file export path
          sed -i.bak "s|@LILYPOND@|$LPBIN/lilypond|" test.tex
          # -shell-escape: required by lyluatex and \gabcsnippet.
          # Two passes, like the app's real _compile_file loop —
          # gregoriotex explicitly asks for a rerun on the first pass
          # ("Line heights ... may have changed"), and on macOS the first
          # pass also logs a spurious snippet error that a single-pass
          # test would wrongly fail on. The final pass decides.
          lualatex -shell-escape -interaction=nonstopmode test.tex 2>&1 | tee lualatex.log || true
          lualatex -shell-escape -interaction=nonstopmode test.tex 2>&1 | tee lualatex2.log
          test -s test.pdf && echo "export path OK: test.pdf produced"

      - name: Compile smoke test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location smoke
          $env:PATH = "$env:TLBIN;$env:LPBIN;$env:PATH"
          # 1. preview path
          & lilypond.exe -dcrop --pdf piece.ly 2>&1 | Tee-Object -FilePath preview.log
          if ($LASTEXITCODE -ne 0) { throw "lilypond -dcrop failed ($LASTEXITCODE)" }
          if (-not (Test-Path piece.cropped.pdf)) { throw "preview path failed: no piece.cropped.pdf" }
          # 2. single-file export path
          # forward slashes in program= — same as a native Windows lyluatex
          # setup (e.g. program={C:/Program Files (x86)/lilypond/bin/lilypond.exe})
          $lp = "$env:LPBIN/lilypond.exe" -replace '\\', '/'
          (Get-Content test.tex) -replace '@LILYPOND@', $lp | Set-Content test.tex
          # two passes, matching the app's multi-pass compile loop (see
          # the bash step) — the final pass decides
          & lualatex.exe -shell-escape -interaction=nonstopmode test.tex 2>&1 | Tee-Object -FilePath lualatex.log
          & lualatex.exe -shell-escape -interaction=nonstopmode test.tex 2>&1 | Tee-Object -FilePath lualatex2.log
          if ($LASTEXITCODE -ne 0) { throw "lualatex failed ($LASTEXITCODE)" }
          if (-not (Test-Path test.pdf)) { throw "smoke test failed: no test.pdf" }
          Write-Output "smoke test OK: test.pdf produced"

      # PDFs as artifacts so the rendering can be eyeballed, not just
      # exit-code-checked (test.pdf = one-file export path;
      # piece.cropped.pdf/.png = preview path)
      - name: Upload result PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            smoke/test.pdf
            smoke/piece.cropped.pdf
            smoke/piece.cropped.png

      # On failure, surface log tails as ::error:: annotations — annotations
      # are readable via the public check-runs API without a login, unlike
      # step logs and step summaries.

      - name: Dump failure diagnostics (macOS/Linux)
        if: failure() && runner.os != 'Windows'
        shell: bash
        run: |
          dump() {
            [ -f "$1" ] || return 0
            msg=$(python3 -c "import sys; d=open(sys.argv[1],'rb').read()[-2500:].decode('utf-8','replace'); print(d.replace('%','%25').replace('\r','').replace('\n','%0A'))" "$1")
            echo "::error title=$1::$msg"
          }
          dump smoke/env.log
          dump smoke/probe.info
          dump smoke/probe.gtex
          dump smoke/test.gsnippet
          dump smoke/test.gsniplog
          dump smoke/lualatex.log
          dump smoke/lualatex2.log
          dump smoke/test.log

      - name: Dump failure diagnostics (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($f in 'smoke\preview.log','smoke\lualatex.log','smoke\test.log','texlive-min\install-tl.log') {
            if (Test-Path $f) {
              $t = Get-Content -Raw $f
              if ($t.Length -gt 2500) { $t = $t.Substring($t.Length - 2500) }
              $t = $t -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
              Write-Output "::error title=$($f -replace '\\','/')::$t"
            }
          }

      - name: Disk usage after + report (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          df -k / | tail -1 | awk '{print $3}' > after.txt
          before=$(cat before.txt)
          after=$(cat after.txt)
          delta_kb=$((after - before))
          {
            echo "## TeX + Lilypond size — ${{ matrix.platform }}"
            echo "- Disk used before: $((before / 1024)) MB"
            echo "- Disk used after: $((after / 1024)) MB"
            echo "- **Delta (TeX Live minimal scheme + Lilypond): $((delta_kb / 1024)) MB**"
            echo ""
            echo "texlive-min / lilypond directories:"
            echo '```'
            du -sh ./texlive-min 2>/dev/null || echo "(texlive-min not found)"
            du -sh ./lilypond-${LILYPOND_VERSION} 2>/dev/null || echo "(lilypond not found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disk usage after + report (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $after = (Get-PSDrive C).Used
          $before = Get-Content before.txt
          $deltaMB = [math]::Round(($after - $before) / 1MB, 1)
          $beforeMB = [math]::Round($before / 1MB, 1)
          $afterMB = [math]::Round($after / 1MB, 1)
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## TeX + Lilypond size - windows"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Disk used before: $beforeMB MB"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Disk used after: $afterMB MB"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Delta (TeX Live minimal scheme + Lilypond): $deltaMB MB**"
          # du -sh equivalents, so the number is comparable with the
          # macOS/Linux legs (drive-used deltas are noisy: pagefile,
          # runner background writes — the mac leg once reported 0 MB)
          $tlMB = [math]::Round((Get-ChildItem -Recurse -Force texlive-min -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          $lpMB = [math]::Round((Get-ChildItem -Recurse -Force "lilypond-$env:LILYPOND_VERSION" -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "texlive-min / lilypond directories:"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "$tlMB MB  texlive-min"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "$lpMB MB  lilypond-$env:LILYPOND_VERSION"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
